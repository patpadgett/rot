[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rot"
version = "0.1.0"
description = "A codebase entropy and health inspector for the terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7",
    "textual>=8.2,<9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
rot = "rot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
